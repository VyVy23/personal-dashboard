  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            cream: '#FAF8F6',
            sand: '#F3EFEA',
            ink: '#2D2A32',
            muted: '#6E6A75',
            lavender: { soft: '#EFE9FE', text: '#6D28D9', border: '#DDD6FE' },
            mint: { soft: '#E3F6EC', text: '#15803D', border: '#BBF7D0' },
            peach: { soft: '#FFE8E6', text: '#BE123C', border: '#FECDD3' },
            sky: { soft: '#E0F2FE', text: '#0369A1', border: '#BAE6FD' },
            butter: { soft: '#FEF3C7', text: '#B45309', border: '#FDE68A' }

  <style>
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, #FDF2F8 0%, #F5F3FF 28%, #EFF6FF 58%, #ECFDF5 85%, #FEFCE8 100%);
      background-attachment: fixed;
      color: #2D2A32;
      -webkit-tap-highlight-color: transparent;
    }
    .pastel-card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 8px 28px -8px rgba(109, 40, 217, 0.08), 0 2px 8px -2px rgba(45, 42, 50, 0.04);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .pastel-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 30px -8px rgba(124, 58, 237, 0.13), 0 4px 12px -2px rgba(236, 72, 153, 0.06);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade { animation: fadeIn 0.2s ease-out; }
  </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row pb-20 md:pb-0">

            { id: 't2', title: 'Ôn tập bài tập định giá xuất khẩu & Incoterms', category: 'Học tập', priority: 'high', status: 'todo', dueDate: '2026-11-16' },

          ],

            { id: 'h3', title: 'Ôn từ vựng ngoại ngữ', category: 'Học tập', days: [true, true, true, false, true, true, true] },
            { id: 'h4', title: 'Đi bộ / Giãn cơ 30 phút', category: 'Sức khỏe', days: [false, true, false, true, true, false, false] }
          ],
          goals: [
            { id: 'g1', title: 'Đạt mục tiêu TOEIC 800+', category: 'Học tập', current: 680, target: 800, unit: 'điểm', deadline: '2026-12-30' },
            { id: 'g2', title: 'Quỹ tiết kiệm dự phòng', category: 'Tài chính', current: 7500000, target: 10000000, unit: '₫', deadline: '2026-12-31' },
            { id: 'g3', title: 'Đọc xong 12 cuốn sách năm nay', category: 'Cá nhân', current: 9, target: 12, unit: 'cuốn', deadline: '2026-12-31' }
          ],
          transactions: [
            { id: 'f1', type: 'income', amount: 4500000, category: 'Thu nhập chính', desc: 'Trợ cấp & làm thêm tháng 11', date: '2026-11-01' },
            { id: 'f2', type: 'income', amount: 1800000, category: 'Freelance', desc: 'Thiết kế slide & dịch tài liệu', date: '2026-11-10' },
            { id: 'f3', type: 'expense', amount: 1200000, category: 'Ăn uống', desc: 'Đi chợ & ăn uống tuần 1-2', date: '2026-11-08' },
            { id: 'f4', type: 'expense', amount: 450000, category: 'Học tập', desc: 'Sách tham khảo & tài liệu in', date: '2026-11-09' },
            { id: 'f5', type: 'expense', amount: 320000, category: 'Di chuyển', desc: 'Xăng xe & gửi xe', date: '2026-11-12' },
            { id: 'f6', type: 'expense', amount: 280000, category: 'Giải trí', desc: 'Cà phê & xem phim cuối tuần', date: '2026-11-14' }
          ],
          notes: [

            { id: 'n2', title: 'Danh sách mua sắm tuần này', content: '- Sữa hạt không đường\n- Ức gà & rau xanh\n- Cà phê rang xay\n- Giấy note pastel', tag: 'Cá nhân', color: 'mint', pinned: true, updatedAt: '2026-11-14' },
            { id: 'n3', title: 'Nhắc nhở sức khỏe', content: 'Ngủ trước 23:30, hạn chế dùng điện thoại 30 phút trước khi ngủ để sáng mai dậy sớm học bài hiệu quả hơn.', tag: 'Sức khỏe', color: 'peach', pinned: false, updatedAt: '2026-11-13' },
            { id: 'n4', title: 'Từ vựng cần nhớ', content: 'FOB (Free On Board), CIF (Cost, Insurance and Freight), L/C (Letter of Credit).', tag: 'Học tập', color: 'butter', pinned: false, updatedAt: '2026-11-11' }
          ]
        };
      }

      let state = loadState();
      let financeChartInstance = null;

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            return { ...getDefaultData(), ...parsed };
          }
        } catch (e) { /* ignore storage errors */ }
        return getDefaultData();
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) { /* ignore storage errors */ }
      }

      function uid(prefix) {
        return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      }

      function formatVND(num) {
        return new Intl.NumberFormat('vi-VN').format(Math.round(num || 0)) + ' ₫';
      }

      function escapeHtml(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function formatDateVN(dateStr) {
        if (!dateStr) return '';
        const [y, m, d] = dateStr.split('-');
        return `${d}/${m}/${y}`;
      }

      function showToast(msg, tone = 'lavender') {
        const colors = {
          lavender: 'bg-[#EFE9FE] text-[#5B21B6] border-[#DDD6FE]',
          mint: 'bg-[#E3F6EC] text-[#15803D] border-[#BBF7D0]',
          peach: 'bg-[#FFE8E6] text-[#BE123C] border-[#FECDD3]'
        };
        const el = document.createElement('div');
        el.className = `pointer-events-auto px-4 py-2.5 rounded-xl border shadow-md text-xs sm:text-sm font-medium animate-fade ${colors[tone] || colors.lavender}`;
        el.textContent = msg;
        document.getElementById('toast-container').appendChild(el);
        setTimeout(() => {
          el.style.opacity = '0';
          el.style.transition = 'opacity 0.25s ease';
          setTimeout(() => el.remove(), 250);
        }, 2400);
      }

      function openModal(title, htmlContent) {
        document.getElementById('modal-title').textContent = title;
        document.getElementById('modal-body').innerHTML = htmlContent;
        const backdrop = document.getElementById('modal-backdrop');
        backdrop.classList.remove('hidden');
        backdrop.classList.add('flex');
      }

      function closeModal() {
        const backdrop = document.getElementById('modal-backdrop');
        backdrop.classList.add('hidden');
        backdrop.classList.remove('flex');
      }

      function openConfirmModal(title, message, onConfirm) {
        openModal(title, `
          <p class="text-sm text-muted mb-5">${escapeHtml(message)}</p>
          <div class="flex justify-end gap-2">
            <button type="button" id="confirm-cancel" class="px-4 py-2 rounded-xl border border-[#EFECE8] text-sm font-medium text-ink hover:bg-sand">Hủy</button>
            <button type="button" id="confirm-ok" class="px-4 py-2 rounded-xl bg-[#BE123C] text-white text-sm font-medium hover:bg-[#9F1239]">Xác nhận</button>
          </div>
        `);
        document.getElementById('confirm-cancel').addEventListener('click', closeModal);
        document.getElementById('confirm-ok').addEventListener('click', () => {
          closeModal();
          onConfirm();
        });
      }

      function renderNav() {
        const dNav = document.getElementById('desktop-nav');
        dNav.innerHTML = NAV_ITEMS.map(item => {
          const active = state.activeTab === item.id;
          return `
            <button type="button" data-nav="${item.id}" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold transition ${active ? item.activeCls : 'text-muted hover:bg-white/70 hover:text-ink'}">
              <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="${item.icon}"/></svg>
              <span class="truncate">${item.label}</span>
            </button>
          `;
        }).join('');

        const mNav = document.getElementById('mobile-nav');
        mNav.innerHTML = NAV_ITEMS.map(item => {
          const active = state.activeTab === item.id;
          return `
            <button type="button" data-nav="${item.id}" class="flex flex-col items-center justify-center py-1.5 px-1 rounded-xl transition ${active ? item.mActiveCls : 'text-muted'}">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="${item.icon}"/></svg>
              <span class="text-[10px] font-medium mt-0.5 truncate max-w-full">${item.short}</span>
            </button>
          `;
        }).join('');

        document.querySelectorAll('[data-nav]').forEach(btn => {
          btn.addEventListener('click', () => {
            state.activeTab = btn.dataset.nav;
            saveState();
            render();
          });
        });

        const currentNav = NAV_ITEMS.find(i => i.id === state.activeTab) || NAV_ITEMS[0];
        document.getElementById('page-title').textContent = currentNav.label;
        const addLabels = {
          overview: 'Thêm việc',
          tasks: 'Thêm công việc',
          calendar: 'Thêm sự kiện',
          goals: 'Thêm mục tiêu',
          finance: 'Thêm giao dịch',
          notes: 'Thêm ghi chú'
        };
        document.getElementById('quick-add-label').textContent = addLabels[state.activeTab] || 'Thêm nhanh';
      }

      function render() {
        renderNav();
        const main = document.getElementById('app-main');
        if (financeChartInstance) {
          financeChartInstance.destroy();
          financeChartInstance = null;
        }
        switch (state.activeTab) {
          case 'overview': renderOverview(main); break;
          case 'tasks': renderTasks(main); break;
          case 'calendar': renderCalendar(main); break;
          case 'goals': renderGoals(main); break;
          case 'finance': renderFinance(main); break;
          case 'notes': renderNotes(main); break;
          default: renderOverview(main);
        }
      }

      // ================= OVERVIEW =================
      function renderOverview(container) {
        const doneTasks = state.tasks.filter(t => t.status === 'done').length;
        const totalTasks = state.tasks.length;
        const todayEvents = state.events.filter(e => e.date === TODAY_STR);
        const totalIncome = state.transactions.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
        const totalExpense = state.transactions.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
        const balance = totalIncome - totalExpense;

        const habitDoneToday = state.habits.filter(h => h.days[6]).length;
        const habitTotal = state.habits.length;
        const pinnedNotes = state.notes.filter(n => n.pinned).slice(0, 2);
        const activeTasks = state.tasks.filter(t => t.status !== 'done').slice(0, 4);

        container.innerHTML = `
          <div class="space-y-6">
            <!-- KPI Row -->
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
              <button type="button" data-jump="tasks" class="text-left rounded-2xl p-4 bg-gradient-to-br from-[#F3E8FF] via-[#FAF5FF] to-[#FCE7F3] border border-[#E9D5FF] shadow-sm hover:shadow-md transition">
                <span class="inline-flex px-2.5 py-1 rounded-lg text-[11px] font-bold bg-white/80 text-[#7E22CE] shadow-2xs">✨ Công việc</span>
                <p class="text-2xl font-bold text-[#4C1D95] mt-3 tabular-nums">${doneTasks}/${totalTasks}</p>
                <p class="text-xs text-[#6B21A8]/80 mt-0.5 font-medium">Đã hoàn thành</p>
              </button>
              <button type="button" data-jump="calendar" class="text-left rounded-2xl p-4 bg-gradient-to-br from-[#E0F2FE] via-[#F0F9FF] to-[#CFFAFE] border border-[#BAE6FD] shadow-sm hover:shadow-md transition">
                <span class="inline-flex px-2.5 py-1 rounded-lg text-[11px] font-bold bg-white/80 text-[#0284C7] shadow-2xs">📅 Lịch hôm nay</span>
                <p class="text-2xl font-bold text-[#0C4A6E] mt-3 tabular-nums">${todayEvents.length}</p>
                <p class="text-xs text-[#0369A1]/80 mt-0.5 font-medium">Sự kiện sắp tới</p>
              </button>
              <button type="button" data-jump="goals" class="text-left rounded-2xl p-4 bg-gradient-to-br from-[#DCFCE7] via-[#ECFDF5] to-[#CCFBF1] border border-[#A7F3D0] shadow-sm hover:shadow-md transition">
                <span class="inline-flex px-2.5 py-1 rounded-lg text-[11px] font-bold bg-white/80 text-[#059669] shadow-2xs">⚡ Thói quen</span>
                <p class="text-2xl font-bold text-[#064E3B] mt-3 tabular-nums">${habitDoneToday}/${habitTotal}</p>
                <p class="text-xs text-[#047857]/80 mt-0.5 font-medium">Check-in hôm nay</p>
              </button>
              <button type="button" data-jump="finance" class="text-left rounded-2xl p-4 bg-gradient-to-br from-[#FFE4E6] via-[#FFF1F2] to-[#FFEDD5] border border-[#FECDD3] shadow-sm hover:shadow-md transition">
                <span class="inline-flex px-2.5 py-1 rounded-lg text-[11px] font-bold bg-white/80 text-[#E11D48] shadow-2xs">💰 Số dư</span>
                <p class="text-lg sm:text-xl font-bold text-[#881337] mt-3 tabular-nums truncate">${formatVND(balance)}</p>
                <p class="text-xs text-[#BE123C]/80 mt-0.5 font-medium">Tháng 11/2026</p>
              </button>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
              <!-- Today's Tasks -->
              <div class="lg:col-span-2 pastel-card rounded-2xl p-5">
                <div class="flex items-center justify-between mb-4">
                  <h3 class="font-bold text-ink text-base">Việc cần làm ưu tiên</h3>
                  <button type="button" data-jump="tasks" class="text-xs font-medium text-[#6D28D9] hover:underline">Xem tất cả →</button>
                </div>
                <div class="space-y-2.5">
                  ${activeTasks.length ? activeTasks.map(t => `
                    <div class="flex items-center justify-between gap-3 p-3 rounded-xl bg-cream border border-[#EFECE8]">
                      <label class="flex items-center gap-3 min-w-0 cursor-pointer flex-1">
                        <input type="checkbox" data-ov-task="${t.id}" class="w-4 h-4 rounded accent-[#6D28D9] cursor-pointer shrink-0" />
                        <div class="min-w-0">
                          <p class="text-sm font-medium text-ink truncate">${escapeHtml(t.title)}</p>
                          <p class="text-xs text-muted">${escapeHtml(t.category)} • Hạn ${formatDateVN(t.dueDate)}</p>
                        </div>
                      </label>
                      ${priorityBadge(t.priority)}
                    </div>
                  `).join('') : '<p class="text-sm text-muted py-4 text-center">Tuyệt vời! Bạn đã hoàn thành hết công việc.</p>'}
                </div>
              </div>

              <!-- Quick Habits -->
              <div class="pastel-card rounded-2xl p-5">
                <div class="flex items-center justify-between mb-4">
                  <h3 class="font-bold text-ink text-base">Thói quen hôm nay</h3>
                  <button type="button" data-jump="goals" class="text-xs font-medium text-[#15803D] hover:underline">Chi tiết →</button>
                </div>
                <div class="space-y-2.5">
                  ${state.habits.map(h => `
                    <button type="button" data-ov-habit="${h.id}" class="w-full flex items-center justify-between p-3 rounded-xl border transition ${h.days[6] ? 'bg-[#E3F6EC]/70 border-[#BBF7D0]' : 'bg-cream border-[#EFECE8] hover:bg-sand/50'}">
                      <span class="text-sm font-medium ${h.days[6] ? 'text-[#15803D] line-through' : 'text-ink'}">${escapeHtml(h.title)}</span>
                      <span class="w-5 h-5 rounded-full flex items-center justify-center text-xs ${h.days[6] ? 'bg-[#15803D] text-white' : 'border border-[#D6D3D1] bg-white'}">
                        ${h.days[6] ? '✓' : ''}
                      </span>
                    </button>
                  `).join('')}
                </div>
              </div>
            </div>

            <!-- Upcoming Events & Pinned Notes -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <div class="pastel-card rounded-2xl p-5">
                <div class="flex items-center justify-between mb-4">
                  <h3 class="font-bold text-ink text-base">Lịch trình sắp tới</h3>
                  <button type="button" data-jump="calendar" class="text-xs font-medium text-[#0369A1] hover:underline">Mở lịch →</button>
                </div>
                <div class="space-y-2.5">
                  ${state.events.slice(0, 3).map(e => `
                    <div class="flex items-center gap-3 p-3 rounded-xl bg-[#E0F2FE]/40 border border-[#BAE6FD]/60">
                      <div class="px-2.5 py-1.5 rounded-lg bg-white text-center shrink-0 border border-[#BAE6FD]">
                        <p class="text-[10px] font-semibold text-[#0369A1] uppercase">Th${e.date.split('-')[1]}</p>
                        <p class="text-sm font-bold text-ink leading-tight">${e.date.split('-')[2]}</p>
                      </div>
                      <div class="min-w-0 flex-1">
                        <p class="text-sm font-semibold text-ink truncate">${escapeHtml(e.title)}</p>
                        <p class="text-xs text-muted">${e.start} – ${e.end} • ${escapeHtml(e.location || e.category)}</p>
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>

              <div class="pastel-card rounded-2xl p-5">
                <div class="flex items-center justify-between mb-4">
                  <h3 class="font-bold text-ink text-base">Ghi chú đã ghim</h3>
                  <button type="button" data-jump="notes" class="text-xs font-medium text-[#B45309] hover:underline">Tất cả ghi chú →</button>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  ${pinnedNotes.length ? pinnedNotes.map(n => {
                    const c = NOTE_COLORS.find(x => x.id === n.color) || NOTE_COLORS[0];
                    return `
                      <div class="p-3.5 rounded-xl border ${c.bg} ${c.border}">
                        <p class="text-sm font-semibold text-ink truncate">${escapeHtml(n.title)}</p>
                        <p class="text-xs text-muted mt-1.5 line-clamp-3 whitespace-pre-line">${escapeHtml(n.content)}</p>
                      </div>
                    `;
                  }).join('') : '<p class="text-sm text-muted col-span-2 py-4 text-center">Chưa có ghi chú nào được ghim.</p>'}
                </div>
              </div>
            </div>
          </div>
        `;

        container.querySelectorAll('[data-jump]').forEach(el => {
          el.addEventListener('click', () => {
            state.activeTab = el.dataset.jump;
            saveState();
            render();
          });
        });
        container.querySelectorAll('[data-ov-task]').forEach(cb => {
          cb.addEventListener('change', () => {
            const t = state.tasks.find(x => x.id === cb.dataset.ovTask);
            if (t) {
              t.status = 'done';
              saveState();
              showToast('Đã hoàn thành công việc!', 'mint');
              render();
            }
          });
        });
        container.querySelectorAll('[data-ov-habit]').forEach(btn => {
          btn.addEventListener('click', () => {
            const h = state.habits.find(x => x.id === btn.dataset.ovHabit);
            if (h) {
              h.days[6] = !h.days[6];
              saveState();
              render();
            }
          });
        });
      }

      // ================= TASKS =================
      function priorityBadge(p) {
        if (p === 'high') return '<span class="px-2 py-0.5 rounded-lg text-[11px] font-semibold bg-[#FFE8E6] text-[#BE123C] shrink-0">Cao</span>';
        if (p === 'medium') return '<span class="px-2 py-0.5 rounded-lg text-[11px] font-semibold bg-[#FEF3C7] text-[#B45309] shrink-0">Trung bình</span>';
        return '<span class="px-2 py-0.5 rounded-lg text-[11px] font-semibold bg-[#E3F6EC] text-[#15803D] shrink-0">Thấp</span>';
      }

      function renderTasks(container) {
        const f = state.taskFilter;
        const filtered = state.tasks.filter(t => {
          const matchSearch = !f.search || t.title.toLowerCase().includes(f.search.toLowerCase()) || t.category.toLowerCase().includes(f.search.toLowerCase());
          const matchStatus = f.status === 'all' || t.status === f.status;
          const matchPriority = f.priority === 'all' || t.priority === f.priority;
          return matchSearch && matchStatus && matchPriority;
        });

        container.innerHTML = `
          <div class="space-y-5">
            <!-- Toolbar -->
            <div class="pastel-card rounded-2xl p-4 flex flex-col lg:flex-row gap-3 lg:items-center lg:justify-between">
              <div class="flex flex-col sm:flex-row gap-2.5 flex-1">
                <input id="task-search" type="text" value="${escapeHtml(f.search)}" placeholder="Tìm công việc hoặc danh mục..." class="flex-1 px-3.5 py-2 rounded-xl bg-cream border border-[#EFECE8] text-sm focus:outline-none focus:border-[#8B5CF6]" />
                <select id="task-filter-status" class="px-3 py-2 rounded-xl bg-cream border border-[#EFECE8] text-sm">
                  <option value="all" ${f.status === 'all' ? 'selected' : ''}>Tất cả trạng thái</option>
                  <option value="todo" ${f.status === 'todo' ? 'selected' : ''}>Cần làm</option>
                  <option value="in_progress" ${f.status === 'in_progress' ? 'selected' : ''}>Đang làm</option>
                  <option value="done" ${f.status === 'done' ? 'selected' : ''}>Hoàn thành</option>
                </select>
                <select id="task-filter-priority" class="px-3 py-2 rounded-xl bg-cream border border-[#EFECE8] text-sm">
                  <option value="all" ${f.priority === 'all' ? 'selected' : ''}>Mọi mức độ</option>
                  <option value="high" ${f.priority === 'high' ? 'selected' : ''}>Ưu tiên cao</option>
                  <option value="medium" ${f.priority === 'medium' ? 'selected' : ''}>Trung bình</option>
                  <option value="low" ${f.priority === 'low' ? 'selected' : ''}>Thấp</option>
                </select>
              </div>
              <div class="flex items-center gap-2 justify-between sm:justify-end">
                <div class="inline-flex rounded-xl bg-cream p-1 border border-[#EFECE8]">
                  <button type="button" data-task-view="list" class="px-3 py-1.5 rounded-lg text-xs font-medium ${state.taskView === 'list' ? 'bg-white shadow-xs text-[#6D28D9]' : 'text-muted'}">Danh sách</button>
                  <button type="button" data-task-view="board" class="px-3 py-1.5 rounded-lg text-xs font-medium ${state.taskView === 'board' ? 'bg-white shadow-xs text-[#6D28D9]' : 'text-muted'}">Bảng Kanban</button>
                </div>
                <button type="button" id="btn-add-task" class="px-3.5 py-2 rounded-xl bg-[#EFE9FE] text-[#6D28D9] hover:bg-[#DDD6FE] text-xs font-semibold transition">+ Việc mới</button>
              </div>
            </div>

            ${state.taskView === 'list' ? `
              <div class="pastel-card rounded-2xl p-4 sm:p-5 space-y-2.5">
                ${filtered.length ? filtered.map(t => `
                  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 p-3.5 rounded-xl bg-cream border border-[#EFECE8]">
                    <div class="flex items-start sm:items-center gap-3 min-w-0 flex-1">
                      <input type="checkbox" data-toggle-task="${t.id}" ${t.status === 'done' ? 'checked' : ''} class="mt-1 sm:mt-0 w-4 h-4 rounded accent-[#6D28D9] cursor-pointer shrink-0" />
                      <div class="min-w-0 flex-1">
                        <p class="text-sm font-semibold ${t.status === 'done' ? 'line-through text-muted' : 'text-ink'}">${escapeHtml(t.title)}</p>
                        <div class="flex flex-wrap items-center gap-2 mt-1 text-xs text-muted">
                          <span class="px-2 py-0.5 rounded-md bg-white border border-[#EFECE8]">${escapeHtml(t.category)}</span>
                          <span>Hạn: ${formatDateVN(t.dueDate)}</span>
                          ${t.repeat && t.repeat !== 'none' ? `<span class="px-2 py-0.5 rounded-md bg-[#EFE9FE] text-[#6D28D9] font-medium">🔁 ${t.repeat === 'daily' ? 'Hàng ngày' : t.repeat === 'weekly' ? 'Hàng tuần' : 'Hàng tháng'}</span>` : ''}
                        </div>
                      </div>
                    </div>
                    <div class="flex items-center gap-2 self-end sm:self-center">
                      ${priorityBadge(t.priority)}
                      <select data-status-task="${t.id}" class="px-2.5 py-1 rounded-lg bg-white border border-[#EFECE8] text-xs font-medium text-ink">
                        <option value="todo" ${t.status === 'todo' ? 'selected' : ''}>Cần làm</option>
                        <option value="in_progress" ${t.status === 'in_progress' ? 'selected' : ''}>Đang làm</option>
                        <option value="done" ${t.status === 'done' ? 'selected' : ''}>Hoàn thành</option>
                      </select>
                      <button type="button" data-edit-task="${t.id}" class="p-1.5 rounded-lg text-muted hover:text-[#6D28D9] hover:bg-white" title="Sửa">✎</button>
                      <button type="button" data-del-task="${t.id}" class="p-1.5 rounded-lg text-muted hover:text-[#BE123C] hover:bg-white" title="Xóa">✕</button>
                    </div>
                  </div>
                `).join('') : '<p class="text-sm text-muted text-center py-8">Không có công việc nào khớp bộ lọc.</p>'}
              </div>
            ` : `
              <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                ${[
                  { key: 'todo', title: 'Cần làm', bg: 'bg-gradient-to-b from-[#E0F2FE]/70 to-[#F0F9FF]/60', badge: 'bg-[#BAE6FD] text-[#0369A1]' },
                  { key: 'in_progress', title: 'Đang làm', bg: 'bg-gradient-to-b from-[#FEF3C7]/70 to-[#FFFBEB]/60', badge: 'bg-[#FDE68A] text-[#B45309]' },
                  { key: 'done', title: 'Hoàn thành', bg: 'bg-gradient-to-b from-[#DCFCE7]/70 to-[#ECFDF5]/60', badge: 'bg-[#A7F3D0] text-[#047857]' }
                ].map(col => {
                  const colTasks = filtered.filter(t => t.status === col.key);
                  return `
                    <div class="rounded-2xl p-4 border border-[#EFECE8] ${col.bg} space-y-3">
                      <div class="flex items-center justify-between">
                        <span class="px-2.5 py-1 rounded-lg text-xs font-semibold ${col.badge}">${col.title}</span>
                        <span class="text-xs font-bold text-muted">${colTasks.length}</span>
                      </div>
                      <div class="space-y-2.5">
                        ${colTasks.map(t => `
                          <div class="bg-white rounded-xl p-3.5 border border-[#EFECE8] shadow-xs space-y-2">
                            <div class="flex items-start justify-between gap-2">
                              <p class="text-sm font-semibold text-ink">${escapeHtml(t.title)}</p>
                              <button type="button" data-del-task="${t.id}" class="text-xs text-muted hover:text-[#BE123C]">✕</button>
                            </div>
                            <div class="flex items-center justify-between text-xs text-muted">
                              <span>${escapeHtml(t.category)} • ${formatDateVN(t.dueDate)}</span>
                              ${priorityBadge(t.priority)}
                            </div>
                            <div class="pt-1 flex items-center gap-1.5">
                              ${col.key !== 'todo' ? `<button type="button" data-move-task="${t.id}:todo" class="text-[11px] px-2 py-1 rounded-lg bg-cream hover:bg-sand text-ink">Cần làm</button>` : ''}
                              ${col.key !== 'in_progress' ? `<button type="button" data-move-task="${t.id}:in_progress" class="text-[11px] px-2 py-1 rounded-lg bg-cream hover:bg-sand text-ink">Đang làm</button>` : ''}
                              ${col.key !== 'done' ? `<button type="button" data-move-task="${t.id}:done" class="text-[11px] px-2 py-1 rounded-lg bg-[#E3F6EC] text-[#15803D] font-medium">Xong</button>` : ''}
                            </div>
                          </div>
                        `).join('') || '<p class="text-xs text-muted text-center py-4">Trống</p>'}
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </div>
        `;

        document.getElementById('task-search').addEventListener('input', e => {
          state.taskFilter.search = e.target.value;
          renderTasks(container);
          const inp = document.getElementById('task-search');
          inp.focus();
          inp.setSelectionRange(inp.value.length, inp.value.length);
        });
        document.getElementById('task-filter-status').addEventListener('change', e => {
          state.taskFilter.status = e.target.value;
          saveState();
          renderTasks(container);
        });
        document.getElementById('task-filter-priority').addEventListener('change', e => {
          state.taskFilter.priority = e.target.value;
          saveState();
          renderTasks(container);
        });
        container.querySelectorAll('[data-task-view]').forEach(btn => {
          btn.addEventListener('click', () => {
            state.taskView = btn.dataset.taskView;
            saveState();
            renderTasks(container);
          });
        });
        document.getElementById('btn-add-task').addEventListener('click', () => openTaskModal());
        container.querySelectorAll('[data-toggle-task]').forEach(cb => {
          cb.addEventListener('change', () => {
            const t = state.tasks.find(x => x.id === cb.dataset.toggleTask);
            if (t) {
              t.status = cb.checked ? 'done' : 'todo';
              saveState();
              renderTasks(container);
            }
          });
        });
        container.querySelectorAll('[data-status-task]').forEach(sel => {
          sel.addEventListener('change', () => {
            const t = state.tasks.find(x => x.id === sel.dataset.statusTask);
            if (t) {
              t.status = sel.value;
              saveState();
              renderTasks(container);
            }
          });
        });
        container.querySelectorAll('[data-move-task]').forEach(btn => {
          btn.addEventListener('click', () => {
            const [id, st] = btn.dataset.moveTask.split(':');
            const t = state.tasks.find(x => x.id === id);
            if (t) {
              t.status = st;
              saveState();
              renderTasks(container);
            }
          });
        });
        container.querySelectorAll('[data-edit-task]').forEach(btn => {
          btn.addEventListener('click', () => openTaskModal(btn.dataset.editTask));
        });
        container.querySelectorAll('[data-del-task]').forEach(btn => {
          btn.addEventListener('click', () => {
            state.tasks = state.tasks.filter(x => x.id !== btn.dataset.delTask);
            saveState();
            showToast('Đã xóa công việc', 'peach');
            renderTasks(container);
          });
        });
      }

      function openTaskModal(editId = null) {
        const existing = editId ? state.tasks.find(x => x.id === editId) : null;
        openModal(existing ? 'Chỉnh sửa công việc' : 'Thêm công việc mới', `
          <form id="form-task" class="space-y-3.5">
            <div>
              <label class="block text-xs font-semibold text-muted mb-1">Tên công việc</label>
              <input name="title" required value="${escapeHtml(existing?.title || '')}" placeholder="Ví dụ: Hoàn thành báo cáo..." class="w-full px-3.5 py-2 rounded-xl bg-cream border border-[#EFECE8] text-sm" />
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-semibold text-muted mb-1">Danh mục</label>
                <select name="category" class="w-full px-3 py-2 rounded-xl bg-cream border border-[#EFECE8] text-sm">
                  ${['Học tập', 'Công việc', 'Cá nhân', 'Sức khỏe'].map(c => `<option value="${c}" ${existing?.category === c ? 'selected' : ''}>${c}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-xs font-semibold text-muted mb-1">Độ ưu tiên</label>
                <select name="priority" class="w-full px-3 py-2 rounded-xl bg-cream border border-[#EFECE8] text-sm">
                  <option value="high" ${existing?.priority === 'high' ? 'selected' : ''}>Cao</option>
                  <option value="medium" ${!existing || existing?.priority === 'medium' ? 'selected' : ''}>Trung bình</option>
                  <option value="low" ${existing?.priority === 'low' ? 'selected' : ''}>Thấp</option>
                </select>
              </div>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-semibold text-muted mb-1">Ngày thực hiện / Hạn</label>
                <input type="date" name="dueDate" value="${existing?.dueDate || state.selectedDate || TODAY_STR}" class="w-full px-3 py-2 rounded-xl bg-cream border border-[#EFECE8] text-sm" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-muted mb-1">Trạng thái</label>
                <select name="status" class="w-full px-3 py-2 rounded-xl bg-cream border border-[#EFECE8] text-sm">
                  <option value="todo" ${!existing || existing?.status === 'todo' ? 'selected' : ''}>Cần làm</option>
                  <option value="in_progress" ${existing?.status === 'in_progress' ? 'selected' : ''}>Đang làm</option>
                  <option value="done" ${existing?.status === 'done' ? 'selected' : ''}>Hoàn thành</option>
                </select>
              </div>
            </div>
            ${!existing ? `
            <div class="p-3 rounded-xl bg-[#EFE9FE]/40 border border-[#DDD6FE] space-y-2.5">
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-semibold text-[#5B21B6] mb-1">🔁 Lặp lại</label>
                  <select id="task-repeat-select" name="repeat" class="w-full px-3 py-2 rounded-xl bg-white border border-[#DDD6FE] text-sm">
                    <option value="none">Không lặp lại</option>
                    <option value="daily">Hàng ngày</option>
                    <option value="weekly">Hàng tuần</option>
                    <option value="monthly">Hàng tháng</option>
                  </select>
                </div>
                <div id="task-repeat-until-wrap" class="hidden">
                  <label class="block text-xs font-semibold text-[#5B21B6] mb-1">Lặp đến ngày</label>
                  <input type="date" id="task-repeat-until" name="repeatUntil" value="${TODAY_STR}" class="w-full px-3 py-2 rounded-xl bg-white border border-[#DDD6FE] text-sm" />
                </div>
              </div>
              <p id="task-repeat-hint" class="hidden text-[11px] text-[#6D28D9]">Tự động tạo hàng loạt công việc cho từng ngày trong khoảng thời gian đã chọn.</p>
            </div>
            ` : ''}
            <div class="flex justify-end gap-2 pt-2">
              <button type="button" id="cancel-task-modal" class="px-4 py-2 rounded-xl border border-[#EFECE8] text-sm font-medium text-ink">Hủy</button>
              <button type="submit" class="px-4 py-2 rounded-xl bg-[#6D28D9] text-white text-sm font-medium hover:bg-[#5B21B6]">Lưu</button>
            </div>
          </form>
        `);
        const repSel = document.getElementById('task-repeat-select');
        const repWrap = document.getElementById('task-repeat-until-wrap');
        const repHint = document.getElementById('task-repeat-hint');
        const repUntilInp = document.getElementById('task-repeat-until');
        if (repSel) {
          repSel.addEventListener('change', () => {
            const show = repSel.value !== 'none';
            repWrap.classList.toggle('hidden', !show);
            repHint.classList.toggle('hidden', !show);
            if (show) {
              const base = new Date((document.querySelector('#form-task [name="dueDate"]').value || TODAY_STR) + 'T00:00:00');
              base.setDate(base.getDate() + (repSel.value === 'monthly' ? 60 : 14));
              repUntilInp.value = `${base.getFullYear()}-${String(base.getMonth() + 1).padStart(2, '0')}-${String(base.getDate()).padStart(2, '0')}`;
            }
          });
        }
        document.getElementById('cancel-task-modal').addEventListener('click', closeModal);
        document.getElementById('form-task').addEventListener('submit', e => {
          e.preventDefault();
          const fd = new FormData(e.target);
          const payload = {
            title: fd.get('title').trim(),
            category: fd.get('category'),
            priority: fd.get('priority'),
            dueDate: fd.get('dueDate'),
            status: fd.get('status')
          };
          if (existing) {
            Object.assign(existing, payload);
            showToast('Đã cập nhật công việc', 'lavender');
          } else {
            const repeat = fd.get('repeat') || 'none';
            const repeatUntil = fd.get('repeatUntil');
            if (repeat !== 'none' && repeatUntil && repeatUntil >= payload.dueDate) {
              const created = [];
              let cur = new Date(payload.dueDate + 'T00:00:00');
              const end = new Date(repeatUntil + 'T00:00:00');
              while (cur <= end && created.length < 60) {
                const dStr = `${cur.getFullYear()}-${String(cur.getMonth() + 1).padStart(2, '0')}-${String(cur.getDate()).padStart(2, '0')}`;
                created.push({ id: uid('t'), ...payload, dueDate: dStr, repeat });
                if (repeat === 'daily') cur.setDate(cur.getDate() + 1);
                else if (repeat === 'weekly') cur.setDate(cur.getDate() + 7);
                else if (repeat === 'monthly') cur.setMonth(cur.getMonth() + 1);
              }
              state.tasks = [...created.reverse(), ...state.tasks];
              showToast(`Đã tạo ${created.length} công việc lặp lại!`, 'mint');
            } else {
              state.tasks.unshift({ id: uid('t'), ...payload, repeat: 'none' });
              showToast('Đã thêm công việc mới', 'mint');
            }
          }
          saveState();
          closeModal();
          render();
        });
      }

      // ================= CALENDAR =================
      function renderCalendar(container) {
        const [yearStr, monthStr] = state.calendarMonth.split('-');
        const year = parseInt(yearStr, 10);
        const month = parseInt(monthStr, 10);
        const firstDay = new Date(year, month - 1, 1);
        const startOffset = (firstDay.getDay() + 6) % 7;
        const daysInMonth = new Date(year, month, 0).getDate();

        const cells = [];
        for (let i = 0; i < startOffset; i++) cells.push(null);
        for (let d = 1; d <= daysInMonth; d++) {
          const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          cells.push({ day: d, dateStr });
        }

        const dayEvents = state.events
          .filter(e => e.date === state.selectedDate)
          .sort((a, b) => a.start.localeCompare(b.start));
        const dayTasks = state.tasks.filter(t => t.dueDate === state.selectedDate);

        container.innerHTML = `
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
            <div class="lg:col-span-2 pastel-card rounded-2xl p-4 sm:p-5">
              <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
                <div>
                  <h3 class="font-bold text-ink text-base sm:text-lg">Tháng ${month}/${year}</h3>
                  <div class="flex items-center gap-3 mt-1 text-[11px] text-muted">
                    <span class="inline-flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-[#0EA5E9]"></span> Sự kiện</span>
                    <span class="inline-flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-[#8B5CF6]"></span> Công việc</span>
                  </div>
                </div>
                <div class="flex items-center gap-1.5">
                  <button type="button" id="cal-prev" class="px-2.5 py-1.5 rounded-xl bg-cream border border-[#EFECE8] text-sm hover:bg-sand">‹</button>
                  <button type="button" id="cal-today" class="px-3 py-1.5 rounded-xl bg-[#E0F2FE] text-[#0369A1] text-xs font-semibold">Hôm nay</button>
                  <button type="button" id="cal-next" class="px-2.5 py-1.5 rounded-xl bg-cream border border-[#EFECE8] text-sm hover:bg-sand">›</button>
                </div>
              </div>

              <div class="grid grid-cols-7 gap-1 text-center text-xs font-semibold text-muted mb-2">
                <div>T2</div><div>T3</div><div>T4</div><div>T5</div><div>T6</div><div>T7</div><div>CN</div>
              </div>
              <div class="grid grid-cols-7 gap-1.5">
                ${cells.map(c => {
                  if (!c) return '<div class="h-14 sm:h-20 rounded-xl bg-cream/40"></div>';
                  const evs = state.events.filter(e => e.date === c.dateStr);
                  const tks = state.tasks.filter(t => t.dueDate === c.dateStr);
                  const isToday = c.dateStr === TODAY_STR;
                  const isSelected = c.dateStr === state.selectedDate;
                  return `
                    <button type="button" data-cal-day="${c.dateStr}" class="h-14 sm:h-20 p-1.5 rounded-xl border text-left flex flex-col justify-between transition ${isSelected ? 'bg-[#E0F2FE]/80 border-[#0284C7] ring-1 ring-[#0284C7]/30' : isToday ? 'bg-[#F3E8FF]/80 border-[#8B5CF6]' : 'bg-white/60 border-[#EFECE8] hover:bg-white'}">
                      <span class="text-xs font-semibold ${isToday ? 'text-[#6D28D9]' : 'text-ink'}">${c.day}</span>
                      <div class="flex flex-wrap gap-1">
                        ${evs.slice(0, 2).map(() => '<span class="w-2 h-2 rounded-full bg-[#0EA5E9]"></span>').join('')}
                        ${tks.slice(0, 2).map(t => `<span class="w-2 h-2 rounded-full ${t.status === 'done' ? 'bg-[#22C55E]' : 'bg-[#8B5CF6]'}"></span>`).join('')}
                        ${(evs.length + tks.length) > 4 ? `<span class="text-[10px] text-muted leading-none">+${evs.length + tks.length - 4}</span>` : ''}
                      </div>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- Selected Day Agenda (Events + Tasks) -->
            <div class="pastel-card rounded-2xl p-5 flex flex-col gap-4">
              <div class="flex items-center justify-between">
                <div>
                  <p class="text-xs text-muted">Lịch ngày</p>
                  <h4 class="text-base font-bold text-ink">${formatDateVN(state.selectedDate)}</h4>
                </div>
                <div class="flex gap-1.5">
                  <button type="button" id="btn-add-cal-task" class="px-2.5 py-1.5 rounded-xl bg-[#EFE9FE] text-[#6D28D9] text-xs font-semibold hover:bg-[#DDD6FE]">+ Việc</button>
                  <button type="button" id="btn-add-event" class="px-2.5 py-1.5 rounded-xl bg-[#E0F2FE] text-[#0369A1] text-xs font-semibold hover:bg-[#BAE6FD]">+ Sự kiện</button>
                </div>
              </div>

              <div class="space-y-4 flex-1">
                <div>
                  <p class="text-[11px] font-bold uppercase tracking-wider text-[#6D28D9] mb-2">Công việc trong ngày (${dayTasks.length})</p>
                  <div class="space-y-2">
                    ${dayTasks.length ? dayTasks.map(t => `
                      <div class="p-3 rounded-xl bg-[#F5F3FF]/70 border border-[#E9D5FF] flex items-center justify-between gap-2">
                        <label class="flex items-center gap-2.5 min-w-0 cursor-pointer flex-1">
                          <input type="checkbox" data-cal-task="${t.id}" ${t.status === 'done' ? 'checked' : ''} class="w-4 h-4 rounded accent-[#6D28D9] cursor-pointer shrink-0" />
                          <div class="min-w-0">
                            <p class="text-xs sm:text-sm font-semibold truncate ${t.status === 'done' ? 'line-through text-muted' : 'text-ink'}">${escapeHtml(t.title)}</p>
                            <p class="text-[11px] text-muted">${escapeHtml(t.category)} ${t.repeat && t.repeat !== 'none' ? '• 🔁' : ''}</p>
                          </div>
                        </label>
                        ${priorityBadge(t.priority)}
                      </div>
                    `).join('') : '<p class="text-xs text-muted py-2">Không có công việc nào trong ngày này.</p>'}
                  </div>
                </div>

                <div>
                  <p class="text-[11px] font-bold uppercase tracking-wider text-[#0284C7] mb-2">Sự kiện (${dayEvents.length})</p>
                  <div class="space-y-2">
                    ${dayEvents.length ? dayEvents.map(e => `
                      <div class="p-3 rounded-xl bg-[#F0F9FF]/80 border border-[#BAE6FD] flex items-start justify-between gap-2">
                        <div class="min-w-0">
                          <p class="text-xs sm:text-sm font-semibold text-ink">${escapeHtml(e.title)}</p>
                          <p class="text-[11px] text-muted mt-0.5">${e.start} – ${e.end} • ${escapeHtml(e.location || e.category)}</p>
                        </div>
                        <button type="button" data-del-event="${e.id}" class="text-xs text-muted hover:text-[#BE123C] p-1">✕</button>
                      </div>
                    `).join('') : '<p class="text-xs text-muted py-2">Không có sự kiện nào trong ngày này.</p>'}
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;

        document.getElementById('cal-prev').addEventListener('click', () => shiftMonth(-1));
        document.getElementById('cal-next').addEventListener('click', () => shiftMonth(1));
        document.getElementById('cal-today').addEventListener('click', () => {
          state.calendarMonth = TODAY_MONTH;
          state.selectedDate = TODAY_STR;
          saveState();
          renderCalendar(container);
        });
        document.getElementById('btn-add-cal-task').addEventListener('click', () => openTaskModal());
        container.querySelectorAll('[data-cal-task]').forEach(cb => {
          cb.addEventListener('change', () => {
            const t = state.tasks.find(x => x.id === cb.dataset.calTask);
            if (t) {
              t.status = cb.checked ? 'done' : 'todo';
              saveState();
              renderCalendar(container);
            }
          });
        });
        container.querySelectorAll('[data-cal-day]').forEach(btn => {
          btn.addEventListener('click', () => {
            state.selectedDate = btn.dataset.calDay;
            saveState();
            renderCalendar(container);
          });
        });
        document.getElementById('btn-add-event').addEventListener('click', () => openEventModal());
        container.querySelectorAll('[data-del-event]').forEach(btn => {
          btn.addEventListener('click', () => {
            state.events = state.events.filter(x => x.id !== btn.dataset.delEvent);
            saveState();
            showToast('Đã xóa sự kiện', 'peach');
            renderCalendar(container);
          });
        });

        function shiftMonth(delta) {
          const d = new Date(year, month - 1 + delta, 1);
          state.calendarMonth = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
          saveState();
          renderCalendar(container);
        }
      }

      function openEventModal() {
        openModal('Thêm sự kiện mới', `
          <form id="form-event" class="space-y-3.5">
            <div>
              <label class="block text-xs font-semibold text-muted mb-1">Tên sự kiện</label>
              <input name="title" required placeholder="Ví dụ: Họp nhóm..." class="w-full px-3.5 py-2 rounded-xl bg-cream border border-[#EFECE8] text-sm" />
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-semibold text-muted mb-1">Ngày</label>
                <input type="date" name="date" value="${state.selectedDate}" required class="w-full px-3 py-2 rounded-xl bg-cream border border-[#EFECE8] text-sm" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-muted mb-1">Phân loại</label>
                <select name="category" class="w-full px-3 py-2 rounded-xl bg-cream border border-[#EFECE8] text-sm">
                  <option>Học tập</option><option>Công việc</option><option>Cá nhân</option><option>Deadline</option>
                </select>
              </div>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-semibold text-muted mb-1">Bắt đầu</label>
                <input type="time" name="start" value="09:00" class="w-full px-3 py-2 rounded-xl bg-cream border border-[#EFECE8] text-sm" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-muted mb-1">Kết thúc</label>
                <input type="time" name="end" value="10:00" class="w-full px-3 py-2 rounded-xl bg-cream border border-[#EFECE8] text-sm" />
              </div>
            </div>
            <div>
              <label class="block text-xs font-semibold text-muted mb-1">Địa điểm / Ghi chú</label>
              <input name="location" placeholder="Ví dụ: Phòng B102 hoặc Online" class="w-full px-3.5 py-2 rounded-xl bg-cream border border-[#EFECE8] text-sm" />
            </div>
            <div class="flex justify-end gap-2 pt-2">
              <button type="button" id="cancel-event-modal" class="px-4 py-2 rounded-xl border border-[#EFECE8] text-sm font-medium text-ink">Hủy</button>
              <button type="submit" class="px-4 py-2 rounded-xl bg-[#0369A1] text-white text-sm font-medium hover:bg-[#075985]">Thêm</button>
            </div>
          </form>
        `);
        document.getElementById('cancel-event-modal').addEventListener('click', closeModal);
        document.getElementById('form-event').addEventListener('submit', e => {
          e.preventDefault();
          const fd = new FormData(e.target);
          const dateVal = fd.get('date');
          state.events.push({
            id: uid('e'),
            title: fd.get('title').trim(),
            date: dateVal,
            start: fd.get('start'),
            end: fd.get('end'),
            category: fd.get('category'),
            location: fd.get('location').trim()
          });
          state.selectedDate = dateVal;
          state.calendarMonth = dateVal.slice(0, 7);
          saveState();
          closeModal();
          showToast('Đã thêm sự kiện vào lịch', 'mint');
          render();
        });
      }

        container.innerHTML = `

              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">

                </div>
                <button type="button" id="btn-add-habit" class="self-start sm:self-auto px-3.5 py-2 rounded-xl bg-[#E3F6EC] text-[#15803D] text-xs font-semibold hover:bg-[#BBF7D0]">+ Thói quen</button>
              </div>

                            <td class="py-3 text-center">

                                ${done ? '✓' : '·'}
                              </button>
                            </td>
                          `).join('')}
                          <td class="py-3 text-right pl-3 text-xs font-bold text-[#15803D] tabular-nums">${pct}%</td>
                          <td class="py-3 text-right">
                            <button type="button" data-del-habit="${h.id}" class="text-xs text-muted hover:text-[#BE123C] p-1">✕</button>
                          </td>
                        </tr>
                      `;
                    }).join('')}
                  </tbody>
                </table>
              </div>
            </div>

            <!-- Long-term Goals -->
            <div class="space-y-3">
              <div class="flex items-center justify-between">
                <h3 class="font-bold text-ink text-base">Mục tiêu cá nhân</h3>
                <button type="button" id="btn-add-goal" class="px-3.5 py-2 rounded-xl bg-[#EFE9FE] text-[#6D28D9] text-xs font-semibold hover:bg-[#DDD6FE]">+ Mục tiêu mới</button>
              </div>
              <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                ${state.goals.map(g => {
                  const pct = g.target > 0 ? Math.min(100, Math.round((g.current / g.target) * 100)) : 0;
                  const step = g.target >= 100000 ? 500000 : g.target >= 100 ? 10 : 1;
                  return `
                    <div class="pastel-card rounded-2xl p-5 flex flex-col justify-between gap-4">

                          <button type="button" data-pin-note="${n.id}" title="Ghim" class="p-1 rounded-lg text-xs ${n.pinned ? 'text-[#6D28D9] font-bold' : 'text-muted hover:text-ink'}">${n.pinned ? '📌' : '📍'}</button>
                          <button type="button" data-edit-note="${n.id}" title="Sửa" class="p-1 rounded-lg text-xs text-muted hover:text-ink">✎</button>
                          <button type="button" data-del-note="${n.id}" title="Xóa" class="p-1 rounded-lg text-xs text-muted hover:text-[#BE123C]">✕</button>
                        </div>
                      </div>
                      <h4 class="font-bold text-ink text-base">${escapeHtml(n.title)}</h4>
                      <p class="text-sm text-ink/80 mt-2 whitespace-pre-line leading-relaxed">${escapeHtml(n.content)}</p>
                    </div>
                    <p class="text-[11px] text-muted">Cập nhật: ${formatDateVN(n.updatedAt)}</p>
                  </div>
                `;
              }).join('') : '<p class="text-sm text-muted col-span-full text-center py-8">Không có ghi chú nào.</p>'}
            </div>
          </div>
        `;

        document.getElementById('note-search').addEventListener('input', e => {
          state.noteFilter.search = e.target.value;
          renderNotes(container);
          const inp = document.getElementById('note-search');
          inp.focus();
          inp.setSelectionRange(inp.value.length, inp.value.length);
        });
        container.querySelectorAll('[data-note-color]').forEach(btn => {
          btn.addEventListener('click', () => {
            state.noteFilter.color = btn.dataset.noteColor;
            renderNotes(container);
          });
        });
        document.getElementById('btn-add-note').addEventListener('click', () => openNoteModal());
        container.querySelectorAll('[data-pin-note]').forEach(btn => {
          btn.addEventListener('click', () => {
            const n = state.notes.find(x => x.id === btn.dataset.pinNote);
            if (n) {
              n.pinned = !n.pinned;
              saveState();
              renderNotes(container);
            }
          });
        });
        container.querySelectorAll('[data-edit-note]').forEach(btn => {
          btn.addEventListener('click', () => openNoteModal(btn.dataset.editNote));
        });
        container.querySelectorAll('[data-del-note]').forEach(btn => {
          btn.addEventListener('click', () => {
            state.notes = state.notes.filter(x => x.id !== btn.dataset.delNote);
            saveState();
            showToast('Đã xóa ghi chú', 'peach');
            renderNotes(container);
          });
        });
      }

      function openNoteModal(editId = null) {
        const existing = editId ? state.notes.find(x => x.id === editId) : null;
        const selectedColor = existing?.color || 'lavender';
        openModal(existing ? 'Chỉnh sửa ghi chú' : 'Thêm ghi chú mới', `
          <form id="form-note" class="space-y-3.5">
            <div>
              <label class="block text-xs font-semibold text-muted mb-1">Tiêu đề</label>
              <input name="title" required value="${escapeHtml(existing?.title || '')}" placeholder="Nhập tiêu đề..." class="w-full px-3.5 py-2 rounded-xl bg-cream border border-[#EFECE8] text-sm" />
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-semibold text-muted mb-1">Thẻ (Tag)</label>
                <input name="tag" value="${escapeHtml(existing?.tag || 'Cá nhân')}" class="w-full px-3 py-2 rounded-xl bg-cream border border-[#EFECE8] text-sm" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-muted mb-1">Màu pastel</label>
                <select name="color" class="w-full px-3 py-2 rounded-xl bg-cream border border-[#EFECE8] text-sm">
                  ${NOTE_COLORS.map(c => `<option value="${c.id}" ${selectedColor === c.id ? 'selected' : ''}>${c.name}</option>`).join('')}
                </select>
              </div>
            </div>
            <div>
              <label class="block text-xs font-semibold text-muted mb-1">Nội dung</label>
              <textarea name="content" rows="4" required placeholder="Viết ghi chú của bạn..." class="w-full px-3.5 py-2 rounded-xl bg-cream border border-[#EFECE8] text-sm">${escapeHtml(existing?.content || '')}</textarea>
            </div>
            <label class="flex items-center gap-2 text-xs font-medium text-ink cursor-pointer">
              <input type="checkbox" name="pinned" ${existing?.pinned ? 'checked' : ''} class="rounded accent-[#6D28D9]" />
              Ghim ghi chú lên đầu
            </label>
            <div class="flex justify-end gap-2 pt-2">
              <button type="button" id="cancel-note-modal" class="px-4 py-2 rounded-xl border border-[#EFECE8] text-sm font-medium">Hủy</button>
              <button type="submit" class="px-4 py-2 rounded-xl bg-[#6D28D9] text-white text-sm font-medium">Lưu</button>
            </div>
          </form>
        `);
        document.getElementById('cancel-note-modal').addEventListener('click', closeModal);
        document.getElementById('form-note').addEventListener('submit', e => {
          e.preventDefault();
          const fd = new FormData(e.target);
          const payload = {
            title: fd.get('title').trim(),
            tag: fd.get('tag').trim() || 'Ghi chú',
            color: fd.get('color'),
            content: fd.get('content').trim(),
            pinned: fd.get('pinned') === 'on',
            updatedAt: TODAY_STR
          };
          if (existing) {
            Object.assign(existing, payload);
            showToast('Đã cập nhật ghi chú', 'lavender');
          } else {
            state.notes.unshift({ id: uid('n'), ...payload });
            showToast('Đã thêm ghi chú mới', 'mint');
          }
          saveState();
          closeModal();
          render();
        });
      }

      // ================= GLOBAL EVENTS =================
      const weekdayNames = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
      document.getElementById('sidebar-date').textContent = `${weekdayNames[_now.getDay()]}, ${formatDateVN(TODAY_STR)}`;
      document.getElementById('modal-close').addEventListener('click', closeModal);
      document.getElementById('modal-backdrop').addEventListener('click', e => {
        if (e.target.id === 'modal-backdrop') closeModal();
      });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') closeModal();
      });

      document.getElementById('btn-quick-add').addEventListener('click', () => {
        if (state.activeTab === 'calendar') openEventModal();
        else if (state.activeTab === 'goals') openGoalModal();
        else if (state.activeTab === 'finance') openTxModal();
        else if (state.activeTab === 'notes') openNoteModal();
        else openTaskModal();
      });

      function handleReset() {
        openConfirmModal('Khôi phục dữ liệu mẫu', 'Toàn bộ thay đổi hiện tại sẽ được đưa về dữ liệu mẫu ban đầu. Bạn có chắc muốn tiếp tục?', () => {
          const currentTab = state.activeTab;
          state = getDefaultData();
          state.activeTab = currentTab;
          saveState();
          showToast('Đã khôi phục dữ liệu mẫu', 'lavender');
          render();
        });
      }

      document.getElementById('btn-reset-demo').addEventListener('click', handleReset);
      document.getElementById('btn-mobile-reset').addEventListener('click', handleReset);

      render();
    })();
  </script>
</body>
</html>
